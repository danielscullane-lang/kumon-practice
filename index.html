<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alannah Always Learns More!</title>
<style>
  :root {
    --bg: #faf5ff;
    --card: #ffffff;
    --primary: #8b5cf6;
    --primary-dark: #7c3aed;
    --primary-light: #ede9fe;
    --secondary: #ec4899;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --danger: #f43f5e;
    --danger-bg: #fff1f2;
    --text: #1e1b4b;
    --muted: #6b7280;
    --border: #e9d5ff;
    --tag-bg: #fdf2f8;
    --tag-text: #be185d;
    --shadow: 0 4px 16px rgba(139, 92, 246, 0.1);
    --shadow-lg: 0 8px 30px rgba(139, 92, 246, 0.15);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at 20% 50%, rgba(236, 72, 153, 0.05) 0%, transparent 50%),
                      radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.07) 0%, transparent 50%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  .container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding: 24px 0 20px;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header .greeting {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 6px;
  }

  /* All-time stats */
  .alltime {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .alltime-item {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .alltime-num {
    font-size: 1.4rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Badge shelf */
  .badge-shelf {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .badge {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    background: #f3f4f6;
    border: 2px dashed #d1d5db;
    transition: all 0.4s ease;
    position: relative;
  }
  .badge.earned {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border: 2px solid #f59e0b;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    animation: badgePop 0.5s ease;
  }
  .badge .badge-label { display: none; }
  @keyframes badgePop {
    0% { transform: scale(1); }
    40% { transform: scale(1.3) rotate(10deg); }
    70% { transform: scale(0.95) rotate(-5deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Streak */
  .streak-bar {
    text-align: center;
    margin-bottom: 20px;
    min-height: 28px;
  }
  .streak-text {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 700;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: white;
    animation: streakGlow 1s ease infinite alternate;
  }
  @keyframes streakGlow {
    from { box-shadow: 0 0 8px rgba(251, 191, 36, 0.4); }
    to { box-shadow: 0 0 16px rgba(251, 191, 36, 0.7); }
  }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    background: var(--card);
    padding: 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .filters select, .filters button {
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 0.9rem;
    background: white;
    color: var(--text);
    cursor: pointer;
    flex: 1;
    min-width: 120px;
    font-weight: 500;
  }
  .filters select:focus { border-color: var(--primary); outline: none; }
  .filters button {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
  }
  .filters button:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    flex: 1;
    min-width: 80px;
    text-align: center;
  }
  .stat-num { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
  .stat-label { font-size: 0.7rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  /* Progress bar */
  .progress-wrap {
    background: var(--primary-light);
    border-radius: 100px;
    height: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 100px;
    transition: width 0.4s ease;
  }

  /* Question card */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 16px;
    border: 1px solid rgba(139, 92, 246, 0.08);
  }
  .card-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    justify-content: center;
  }
  .tag {
    font-size: 0.75rem;
    padding: 4px 12px;
    border-radius: 100px;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-weight: 600;
  }
  .tag.stretch { background: #fef3c7; color: #92400e; }
  .question-num {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
    margin-left: auto;
  }
  .question-text {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.6;
    margin-bottom: 24px;
    color: var(--text);
    text-align: center;
  }
  .answer-input {
    width: 100%;
    max-width: 400px;
    margin: 0 auto 14px;
    display: block;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 1.15rem;
    outline: none;
    transition: all 0.2s;
    font-weight: 500;
    text-align: center;
  }
  .answer-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
  .answer-input.correct { border-color: var(--success); background: var(--success-bg); }
  .answer-input.incorrect { border-color: var(--danger); background: var(--danger-bg); }

  .btn-row {
    display: flex;
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
  }
  .btn {
    padding: 13px 20px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    flex: 1;
    transition: all 0.15s;
  }
  .btn-check {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
  }
  .btn-check:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139,92,246,0.3); }
  .btn-skip { background: var(--primary-light); color: var(--primary); }
  .btn-skip:hover { background: #ddd6fe; }
  .btn-next { background: linear-gradient(135deg, var(--success), #059669); color: white; display: none; }
  .btn-next:hover { transform: translateY(-1px); }
  .btn-save {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: white;
    max-width: 220px;
    margin: 0 auto 10px;
    display: block;
  }
  .btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
  .btn-save:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  /* Feedback */
  .feedback {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    display: none;
    text-align: center;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }
  .feedback.correct { background: var(--success-bg); color: #065f46; border: 1px solid #a7f3d0; }
  .feedback.incorrect { background: var(--danger-bg); color: #9f1239; border: 1px solid #fecdd3; }

  /* Score summary */
  .summary {
    display: none;
    text-align: center;
    padding: 36px 24px;
  }
  .summary h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; color: var(--text); }
  .summary .score-big {
    font-size: 3.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 16px 0;
  }
  .summary p { color: var(--muted); margin-bottom: 8px; font-size: 1.05rem; }
  .summary .badges-earned {
    font-size: 2rem;
    margin: 16px 0 24px;
    letter-spacing: 6px;
  }

  /* History panel */
  .history-panel {
    display: none;
  }
  .history-panel.active { display: block; }
  .history-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 6px;
  }
  .history-table th {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 700;
    padding: 8px 10px;
    text-align: left;
  }
  .history-table td {
    padding: 10px;
    background: var(--primary-light);
    font-size: 0.9rem;
    font-weight: 500;
  }
  .history-table tr td:first-child { border-radius: 10px 0 0 10px; }
  .history-table tr td:last-child { border-radius: 0 10px 10px 0; }
  .history-empty {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .history-best {
    text-align: center;
    padding: 16px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border-radius: var(--radius);
    font-weight: 700;
    color: #92400e;
    font-size: 1.1rem;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Nav */
  .nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .nav-btn {
    padding: 9px 20px;
    border-radius: 100px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .nav-btn:hover { border-color: var(--primary); color: var(--primary); }
  .nav-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-color: transparent;
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.3); }
  }

  /* Badge popup */
  .badge-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    border-radius: 24px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    z-index: 999;
    animation: popIn 0.5s ease forwards;
  }
  .badge-popup .emoji { font-size: 4rem; margin-bottom: 12px; }
  .badge-popup .title { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
  .badge-popup .sub { font-size: 0.95rem; color: var(--muted); margin-top: 4px; }
  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0); }
    60% { transform: translate(-50%, -50%) scale(1.1); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* Save status */
  .save-status {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
  }

  @media (max-width: 480px) {
    .container { max-width: 100%; }
    .question-text { font-size: 1.15rem; }
    .stat-num { font-size: 1.2rem; }
    .badge { width: 44px; height: 44px; font-size: 1.3rem; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Alannah Always Learns More!</h1>
    <p class="greeting" id="greeting">Loading your questions...</p>
  </header>

  <div id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Fetching question bank...</p>
    </div>

    <div id="main" style="display:none">
      <!-- All-time stats -->
      <div class="alltime" id="alltime">
        <div class="alltime-item"><div class="alltime-num" id="alltime-sessions">0</div>Sessions</div>
        <div class="alltime-item"><div class="alltime-num" id="alltime-badges">0</div>Badges</div>
        <div class="alltime-item"><div class="alltime-num" id="alltime-best">-</div>Best Score</div>
        <div class="alltime-item"><div class="alltime-num" id="alltime-questions">0</div>Questions</div>
      </div>

      <!-- Badge shelf -->
      <div class="badge-shelf" id="badge-shelf">
        <div class="badge" id="badge-0">?</div>
        <div class="badge" id="badge-1">?</div>
        <div class="badge" id="badge-2">?</div>
        <div class="badge" id="badge-3">?</div>
        <div class="badge" id="badge-4">?</div>
      </div>

      <!-- Streak -->
      <div class="streak-bar" id="streak-bar"></div>

      <!-- Mode nav -->
      <div class="nav">
        <button class="nav-btn active" onclick="setMode('practice')" id="nav-practice">Practice</button>
        <button class="nav-btn" onclick="setMode('test')" id="nav-test">Test Mode</button>
        <button class="nav-btn" onclick="setMode('review')" id="nav-review">Review Errors</button>
        <button class="nav-btn" onclick="setMode('history')" id="nav-history">History</button>
      </div>

      <!-- Practice panels (question card, filters, stats) -->
      <div id="practice-panel">
        <!-- Filters -->
        <div class="filters">
          <select id="filter-age" onchange="applyFilters()">
            <option value="">All Ages</option>
          </select>
          <select id="filter-topic" onchange="applyFilters()">
            <option value="">All Topics</option>
          </select>
          <select id="filter-paper" onchange="applyFilters()">
            <option value="">All Papers</option>
          </select>
          <button onclick="startSession()">Let's Go!</button>
        </div>

        <!-- Stats -->
        <div class="stats">
          <div class="stat"><div class="stat-num" id="stat-remaining">0</div><div class="stat-label">Left</div></div>
          <div class="stat"><div class="stat-num" id="stat-correct" style="color:var(--success)">0</div><div class="stat-label">Correct</div></div>
          <div class="stat"><div class="stat-num" id="stat-wrong" style="color:var(--danger)">0</div><div class="stat-label">Wrong</div></div>
          <div class="stat"><div class="stat-num" id="stat-score">-</div><div class="stat-label">Score</div></div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap">
          <div class="progress-bar" id="progress-bar" style="width:0%"></div>
        </div>

        <!-- Question card -->
        <div class="card" id="question-card">
          <div class="card-meta">
            <span class="tag" id="tag-age"></span>
            <span class="tag" id="tag-topic"></span>
            <span class="tag stretch" id="tag-stretch" style="display:none">Stretch</span>
            <span class="question-num" id="tag-ref"></span>
          </div>
          <div class="question-text" id="question-text">Pick your filters and press Let's Go!</div>
          <input class="answer-input" id="answer-input" type="text" placeholder="Type your answer here..."
                 onkeydown="if(event.key==='Enter') checkAnswer()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          <div class="btn-row">
            <button class="btn btn-check" onclick="checkAnswer()">Check</button>
            <button class="btn btn-skip" onclick="skipQuestion()">Skip</button>
            <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Next</button>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>

        <!-- Summary -->
        <div class="card summary" id="summary">
          <h2 id="summary-title">Session Complete!</h2>
          <div class="score-big" id="summary-score">-</div>
          <p id="summary-detail"></p>
          <div class="badges-earned" id="summary-badges"></div>
          <p id="summary-message" style="font-weight:600;color:var(--primary);margin-bottom:20px"></p>
          <button class="btn btn-save" id="btn-save" onclick="saveSession()">Save Practice</button>
          <p class="save-status" id="save-status"></p>
          <button class="btn btn-check" onclick="startSession()" style="max-width:220px;margin:0 auto;display:block">Go Again!</button>
        </div>
      </div>

      <!-- History panel -->
      <div class="history-panel" id="history-panel">
        <div class="history-best" id="history-best-banner"></div>
        <div class="card">
          <div id="history-content"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRZo_U7fRDtIzQ1Qw_jVbVDotRNjhGHXwYcuwVYFxJfctZlmBC_AX2iHPIbJCAqfEqV_d7h1DfmL2SX/pub?output=csv';

// SET THESE AFTER GOOGLE APPS SCRIPT SETUP:
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZzmfpJhzfvHQPWluxaXaWX8vhcnqwoSMpDEExAdWg87edhvxkBirTQSuQ97-Dnj05/exec';
var RESULTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQbsDqmsPfz5xKu40gAkCDp5_IpM8QzKE-2vqLUnvm62KHEGoy0LXd8NmprJlsFgH-kib2y7ZBq0tRf/pub?output=csv';

var BADGES = [
  { emoji: '⭐', name: 'Star' },
  { emoji: '🦄', name: 'Unicorn' },
  { emoji: '🍎', name: 'Apple' },
  { emoji: '🥕', name: 'Carrot' },
  { emoji: '🐰', name: 'Bunny' },
];

var PRAISE = [
  'Brilliant, Alannah!',
  'You\'re on fire!',
  'Superstar!',
  'Nailed it!',
  'Amazing work, Alannah!',
  'You\'re smashing it!',
  'Fantastic!',
  'Way to go!',
  'That\'s the one!',
  'Alannah, you legend!',
  'Perfect!',
  'Boom! Correct!',
  'Maths queen!',
  'Unstoppable!',
];

var FULL_NAME_PRAISE = [
  'Alannah Niamh Sophia Scullane, you absolute genius!',
  'Take a bow, Alannah Niamh Sophia Scullane!',
  'Alannah Niamh Sophia Scullane strikes again!',
  'The one and only Alannah Niamh Sophia Scullane!',
];

var ENCOURAGE = [
  'Nearly, Alannah! You\'ll get the next one.',
  'Good try! Keep going.',
  'Don\'t worry - you\'re learning!',
  'So close! Next one is yours.',
  'That\'s a tricky one. Onwards!',
  'Every mistake makes you stronger!',
  'Keep at it, Alannah!',
];

var GREETINGS = [
  'You\'ve got this, Alannah!',
  'Ready to be brilliant, Alannah?',
  'Let\'s do some maths magic!',
  'Time to shine, Alannah!',
];

var allQuestions = [];
var sessionQueue = [];
var sessionIndex = 0;
var correct = 0;
var wrong = 0;
var streak = 0;
var badgesEarned = 0;
var errorList = [];
var mode = 'practice';
var answered = false;
var sessionSaved = false;
var practiceHistory = [];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ── LocalStorage helpers ─────────────────────────────────────────────────────
function loadHistory() {
  try {
    var data = localStorage.getItem('alannah-history');
    if (data) practiceHistory = JSON.parse(data);
  } catch(e) {}
  updateAlltimeStats();
}

function saveHistory() {
  try {
    localStorage.setItem('alannah-history', JSON.stringify(practiceHistory));
  } catch(e) {}
}

function updateAlltimeStats() {
  var totalSessions = practiceHistory.length;
  var totalBadges = 0;
  var totalQuestions = 0;
  var bestScore = 0;
  for (var i = 0; i < practiceHistory.length; i++) {
    totalBadges += (practiceHistory[i].badges || 0);
    totalQuestions += (practiceHistory[i].correct || 0) + (practiceHistory[i].wrong || 0);
    if (practiceHistory[i].score > bestScore) bestScore = practiceHistory[i].score;
  }
  document.getElementById('alltime-sessions').textContent = totalSessions;
  document.getElementById('alltime-badges').textContent = totalBadges;
  document.getElementById('alltime-best').textContent = totalSessions > 0 ? bestScore + '%' : '-';
  document.getElementById('alltime-questions').textContent = totalQuestions;
}

// ── Google Sheets save ───────────────────────────────────────────────────────
function saveToSheet(record) {
  if (!SCRIPT_URL) return;
  try {
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(record)
    });
  } catch(e) {}
}

function saveSession() {
  if (sessionSaved) return;
  sessionSaved = true;

  var total = correct + wrong;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  var now = new Date();
  var record = {
    date: now.toISOString().split('T')[0],
    time: now.toTimeString().split(' ')[0].substring(0, 5),
    mode: mode,
    correct: correct,
    wrong: wrong,
    score: pct,
    badges: badgesEarned,
    questions: total
  };

  practiceHistory.push(record);
  saveHistory();
  saveToSheet(record);
  updateAlltimeStats();

  var btn = document.getElementById('btn-save');
  btn.textContent = 'Saved!';
  btn.disabled = true;
  document.getElementById('save-status').textContent = 'Session saved to your history.';
}

// ── Fetch remote history ─────────────────────────────────────────────────────
async function fetchRemoteHistory() {
  if (!RESULTS_CSV_URL) return;
  try {
    var res = await fetch(RESULTS_CSV_URL);
    if (!res.ok) return;
    var text = await res.text();
    var rows = parseCSV(text);
    if (rows.length < 2) return;
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row[0]) continue;
      var exists = practiceHistory.some(function(h) { return h.date === row[0] && h.time === row[1]; });
      if (!exists) {
        practiceHistory.push({
          date: row[0], time: row[1], mode: row[2],
          correct: parseInt(row[3]) || 0, wrong: parseInt(row[4]) || 0,
          score: parseInt(row[5]) || 0, badges: parseInt(row[6]) || 0,
          questions: parseInt(row[7]) || 0
        });
      }
    }
    saveHistory();
    updateAlltimeStats();
  } catch(e) {}
}

// ── Render history ───────────────────────────────────────────────────────────
function renderHistory() {
  var container = document.getElementById('history-content');
  var banner = document.getElementById('history-best-banner');

  if (practiceHistory.length === 0) {
    banner.style.display = 'none';
    container.innerHTML = '<div class="history-empty">No sessions saved yet, Alannah!<br>Complete a session and press Save Practice.</div>';
    return;
  }

  var totalBadges = 0;
  var bestScore = 0;
  var totalCorrect = 0;
  for (var i = 0; i < practiceHistory.length; i++) {
    totalBadges += (practiceHistory[i].badges || 0);
    totalCorrect += (practiceHistory[i].correct || 0);
    if (practiceHistory[i].score > bestScore) bestScore = practiceHistory[i].score;
  }

  banner.style.display = 'block';
  banner.textContent = '🏆 Best: ' + bestScore + '% · ' + totalBadges + ' total badges · ' + totalCorrect + ' questions nailed';

  var sorted = practiceHistory.slice().reverse();
  var html = '<table class="history-table"><thead><tr><th>Date</th><th>Time</th><th>Mode</th><th>Score</th><th>Correct</th><th>Badges</th></tr></thead><tbody>';
  var limit = Math.min(sorted.length, 20);
  for (var j = 0; j < limit; j++) {
    var h = sorted[j];
    var badgeIcons = '';
    for (var b = 0; b < (h.badges || 0); b++) badgeIcons += BADGES[b].emoji;
    html += '<tr><td>' + (h.date || '') + '</td><td>' + (h.time || '') + '</td><td>' + (h.mode || '') + '</td><td><strong>' + (h.score || 0) + '%</strong></td><td>' + (h.correct || 0) + '/' + ((h.correct || 0) + (h.wrong || 0)) + '</td><td>' + (badgeIcons || '-') + '</td></tr>';
  }
  html += '</tbody></table>';
  if (sorted.length > 20) html += '<p style="text-align:center;color:var(--muted);font-size:0.85rem;margin-top:12px">Showing last 20 sessions</p>';
  container.innerHTML = html;
}

// ── CSV parser ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  var rows = [];
  var i = 0;
  while (i < text.length) {
    var row = [];
    while (i < text.length && text[i] !== '\n') {
      if (text[i] === '"') {
        var cell = '';
        i++;
        while (i < text.length) {
          if (text[i] === '"' && text[i+1] === '"') { cell += '"'; i += 2; }
          else if (text[i] === '"') { i++; break; }
          else { cell += text[i++]; }
        }
        row.push(cell.trim());
        if (text[i] === ',') i++;
      } else {
        var cell2 = '';
        while (i < text.length && text[i] !== ',' && text[i] !== '\n') cell2 += text[i++];
        row.push(cell2.trim());
        if (text[i] === ',') i++;
      }
    }
    if (text[i] === '\n') i++;
    if (row.length > 1) rows.push(row);
  }
  return rows;
}

async function loadData() {
  try {
    var res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var text = await res.text();
    var rows = parseCSV(text);
    allQuestions = rows.slice(1).map(function(r) {
      return { subject: r[0], age: r[1], paper: r[2], qnum: r[3], topic: r[4], question: r[5], answer: r[6], marks: r[7], notes: r[8] };
    }).filter(function(q) { return q.question && q.answer; });

    populateFilters();
    document.getElementById('greeting').textContent = pick(GREETINGS) + ' ' + allQuestions.length + ' questions ready.';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    startSession();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      '<p style="color:var(--danger)">Could not load questions.<br><small>' + e.message + '</small></p>' +
      '<p style="color:var(--muted);margin-top:8px;font-size:0.85rem">Make sure the Google Sheet is published:<br>' +
      'File → Share → Publish to web → Entire Document → CSV → Publish</p>';
  }
}

function populateFilters() {
  var ages = []; var topics = []; var papers = [];
  var ageSet = {}; var topicSet = {}; var paperSet = {};
  for (var i = 0; i < allQuestions.length; i++) {
    var q = allQuestions[i];
    if (!ageSet[q.age]) { ageSet[q.age] = true; ages.push(q.age); }
    if (!topicSet[q.topic]) { topicSet[q.topic] = true; topics.push(q.topic); }
    var pk = 'Paper ' + q.paper;
    if (!paperSet[pk]) { paperSet[pk] = true; papers.push(pk); }
  }
  ages.sort(); topics.sort();
  papers.sort(function(a,b) { return parseInt(a.split(' ')[1]) - parseInt(b.split(' ')[1]); });
  fill('filter-age', ages.map(function(v) { return [v, v]; }));
  fill('filter-topic', topics.map(function(v) { return [v, v]; }));
  fill('filter-paper', papers.map(function(v) { return [v, v.split(' ')[1]]; }));
}

function fill(id, pairs) {
  var sel = document.getElementById(id);
  for (var i = 0; i < pairs.length; i++) {
    var opt = document.createElement('option');
    opt.value = pairs[i][1]; opt.textContent = pairs[i][0];
    sel.appendChild(opt);
  }
}

function getFiltered() {
  var age = document.getElementById('filter-age').value;
  var topic = document.getElementById('filter-topic').value;
  var paper = document.getElementById('filter-paper').value;
  return allQuestions.filter(function(q) {
    return (!age || q.age === age) && (!topic || q.topic === topic) && (!paper || q.paper === paper);
  });
}

function applyFilters() {}

function setMode(m) {
  mode = m;
  ['practice','test','review','history'].forEach(function(id) {
    document.getElementById('nav-' + id).className = 'nav-btn' + (id === m ? ' active' : '');
  });

  if (m === 'history') {
    document.getElementById('practice-panel').style.display = 'none';
    document.getElementById('history-panel').className = 'history-panel active';
    renderHistory();
  } else {
    document.getElementById('practice-panel').style.display = 'block';
    document.getElementById('history-panel').className = 'history-panel';
    startSession();
  }
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function resetBadges() {
  badgesEarned = 0;
  for (var i = 0; i < 5; i++) {
    var el = document.getElementById('badge-' + i);
    el.className = 'badge';
    el.textContent = '?';
  }
}

function awardBadge() {
  if (badgesEarned >= 5) return;
  var idx = badgesEarned;
  badgesEarned++;
  var el = document.getElementById('badge-' + idx);
  el.className = 'badge earned';
  el.textContent = BADGES[idx].emoji;
  showBadgePopup(BADGES[idx]);
}

function showBadgePopup(badge) {
  var popup = document.createElement('div');
  popup.className = 'badge-popup';
  popup.innerHTML = '<div class="emoji">' + badge.emoji + '</div><div class="title">Badge Earned!</div><div class="sub">You collected the ' + badge.name + '!</div>';
  document.body.appendChild(popup);
  setTimeout(function() { popup.remove(); }, 1800);
  spawnConfetti();
}

function spawnConfetti() {
  var colors = ['#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444'];
  for (var i = 0; i < 30; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.top = '-10px';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(piece);
    setTimeout(function() { piece.remove(); }, 4000);
  }
}

function getBadgeThresholds(total) {
  if (total <= 0) return [1, 2, 3, 4, 5];
  var step = Math.max(1, Math.floor(total / 5));
  return [step, step * 2, step * 3, step * 4, total];
}

function startSession() {
  correct = 0; wrong = 0; streak = 0; answered = false; sessionSaved = false;
  resetBadges();
  updateStreak();

  var btn = document.getElementById('btn-save');
  btn.textContent = 'Save Practice';
  btn.disabled = false;
  document.getElementById('save-status').textContent = '';

  if (mode === 'review') {
    sessionQueue = errorList.slice();
    if (!sessionQueue.length) {
      document.getElementById('question-text').textContent =
        'No errors to review yet, Alannah — do some practice first!';
      return;
    }
  } else {
    var pool = getFiltered();
    if (!pool.length) pool = allQuestions;
    sessionQueue = shuffle(pool.slice());
  }

  sessionIndex = 0;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('question-card').style.display = 'block';
  updateStats();
  showQuestion();
}

function showQuestion() {
  if (sessionIndex >= sessionQueue.length) { showSummary(); return; }
  var q = sessionQueue[sessionIndex];
  answered = false;

  document.getElementById('tag-age').textContent = q.age;
  document.getElementById('tag-topic').textContent = q.topic;
  document.getElementById('tag-ref').textContent = 'Paper ' + q.paper + ' · Q' + q.qnum;
  document.getElementById('tag-stretch').style.display =
    (q.notes && q.notes.indexOf('★') !== -1) ? 'inline-block' : 'none';

  var qText = q.question;
  if (needsUnits(q.answer)) qText += ' (State the units.)';
  document.getElementById('question-text').textContent = qText;

  var inp = document.getElementById('answer-input');
  inp.value = '';
  inp.className = 'answer-input';
  inp.disabled = false;
  inp.focus();

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.querySelector('.btn-check').style.display = 'inline-block';
  document.querySelector('.btn-skip').style.display = 'inline-block';

  updateStats();
}

function normalise(s) {
  return s.toString().trim().toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/[‘’]/g, "'")
    .replace(/°/g, ' degrees ')
    .replace(/\bdeg\b/g, ' degrees ')
    .replace(/£/g, ' pounds ')
    .replace(/%/g, ' percent ')
    .replace(/\s+/g, ' ')
    .trim();
}

function normaliseAnswer(userAns, correctAns) {
  if (normalise(userAns) === normalise(correctAns)) return true;
  var u = normalise(userAns);
  var c = normalise(correctAns);
  var uNum = u.replace(/[^0-9.\-\/]/g, '');
  var cNum = c.replace(/[^0-9.\-\/]/g, '');
  if (uNum && uNum === cNum) {
    var uLetters = u.replace(/[0-9.\-\/\s]/g, '');
    var cLetters = c.replace(/[0-9.\-\/\s]/g, '');
    if (uLetters === cLetters) return true;
    if (cLetters === 'c' && (uLetters === 'c' || uLetters === 'degreesc')) return true;
    if (cLetters === 'f' && (uLetters === 'f' || uLetters === 'degreesf')) return true;
  }
  return false;
}

function needsUnits(answer) {
  var a = answer.toLowerCase();
  return /°|degrees|cm|mm|m\b|km|kg|g\b|ml|litres|liters|£|%|percent|mph|hours|minutes|seconds/.test(a);
}

function checkAnswer() {
  if (answered) { nextQuestion(); return; }
  var q = sessionQueue[sessionIndex];
  var userAns = document.getElementById('answer-input').value.trim();
  if (!userAns) return;

  var correctAns = q.answer;
  var isCorrect = normaliseAnswer(userAns, correctAns);

  answered = true;
  var inp = document.getElementById('answer-input');
  inp.className = 'answer-input ' + (isCorrect ? 'correct' : 'incorrect');
  inp.disabled = true;

  var fb = document.getElementById('feedback');
  if (isCorrect) {
    correct++;
    streak++;
    var msg = (Math.random() < 0.08) ? pick(FULL_NAME_PRAISE) : pick(PRAISE);
    if (streak >= 3) msg += ' (' + streak + ' in a row!)';
    fb.className = 'feedback correct';
    fb.textContent = msg;

    var thresholds = getBadgeThresholds(sessionQueue.length);
    if (thresholds.indexOf(correct) !== -1 && badgesEarned < 5) {
      awardBadge();
    }
  } else {
    wrong++;
    streak = 0;
    if (!errorList.find(function(e) { return e.qnum === q.qnum && e.paper === q.paper; })) {
      errorList.push(q);
    }
    fb.className = 'feedback incorrect';
    fb.textContent = pick(ENCOURAGE) + ' The answer was: ' + correctAns;
  }
  fb.style.display = 'block';

  document.querySelector('.btn-check').style.display = 'none';
  document.querySelector('.btn-skip').style.display = 'none';
  document.getElementById('btn-next').style.display = 'inline-block';

  updateStreak();
  updateStats();
}

function skipQuestion() {
  streak = 0;
  updateStreak();
  sessionIndex++;
  showQuestion();
}

function nextQuestion() {
  sessionIndex++;
  showQuestion();
}

function updateStreak() {
  var bar = document.getElementById('streak-bar');
  if (streak >= 3) {
    bar.innerHTML = '<span class="streak-text">🔥 ' + streak + ' in a row!</span>';
  } else {
    bar.innerHTML = '';
  }
}

function updateStats() {
  var remaining = sessionQueue.length - sessionIndex;
  var total = correct + wrong;
  var pct = total > 0 ? Math.round(correct / total * 100) : '-';

  document.getElementById('stat-remaining').textContent = remaining;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-score').textContent = pct === '-' ? '-' : pct + '%';

  var pctDone = sessionQueue.length > 0 ? (sessionIndex / sessionQueue.length * 100) : 0;
  document.getElementById('progress-bar').style.width = pctDone + '%';
}

function showSummary() {
  document.getElementById('question-card').style.display = 'none';
  var summary = document.getElementById('summary');
  summary.style.display = 'block';
  var total = correct + wrong;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById('summary-score').textContent = pct + '%';
  document.getElementById('summary-detail').textContent = correct + ' correct out of ' + total + ' answered';

  var badgeStr = '';
  for (var i = 0; i < badgesEarned; i++) badgeStr += BADGES[i].emoji;
  document.getElementById('summary-badges').textContent = badgeStr || '';

  var msg = '';
  if (pct === 100) msg = 'PERFECT SCORE! Alannah Niamh Sophia Scullane, you are a maths superstar!';
  else if (pct >= 80) msg = 'Brilliant work, Alannah! You\'re so close to perfection!';
  else if (pct >= 60) msg = 'Great effort, Alannah! Keep practising and you\'ll smash it!';
  else msg = 'Good try, Alannah! Every session makes you stronger!';
  document.getElementById('summary-message').textContent = msg;
  document.getElementById('summary-title').textContent =
    badgesEarned === 5 ? 'ALL BADGES COLLECTED!' : 'Session Complete!';

  if (badgesEarned >= 3) spawnConfetti();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
loadHistory();
fetchRemoteHistory();
loadData();
</script>
